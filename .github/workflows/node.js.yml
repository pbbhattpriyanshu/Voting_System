name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v3

    # 🔹 Login to DockerHub
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 🔹 Build Backend
    - name: Build Backend Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/voting-system-server:v4 ./Server

    # 🔹 Build Frontend
    - name: Build Frontend Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/voting-system-client:v2 ./Client

    # 🔹 Push Images
    - name: Push Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/voting-system-server:v4
        docker push ${{ secrets.DOCKER_USERNAME }}/voting-system-client:v2

    # 🔹 Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/voting-system-server:v4
          docker pull ${{ secrets.DOCKER_USERNAME }}/voting-system-client:v2

          docker rm -f backend || true
          docker rm -f frontend || true

          docker run -d -p 4000:4000 --name backend --restart always \
          -e DB_CONNECT='${{ secrets.DB_CONNECT }}' \
          -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
          ${{ secrets.DOCKER_USERNAME }}/voting-system-server:v4

          docker run -d -p 80:80 --name frontend --restart always \
          ${{ secrets.DOCKER_USERNAME }}/voting-system-client:v2
          