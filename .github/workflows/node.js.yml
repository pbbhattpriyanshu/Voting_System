name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v3

    # 🔹 Login to DockerHub
    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 🔹 Build Backend
    - name: Build Backend Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/voting-system-server:latest ./Server

    # 🔹 Build Frontend
    - name: Build Frontend Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/voting-system-client:latest ./Client

    # 🔹 Push Images
    - name: Push Images
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/voting-system-server:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/voting-system-client:latest

    # 🔹 Deploy to EC2
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/voting-system-server:latest
          docker pull ${{ secrets.DOCKER_USERNAME }}/voting-system-client:latest

          docker stop backend || true
          docker rm backend || true
          docker stop frontend || true
          docker rm frontend || true

          docker run -d -p 5000:5000 --name backend \
          -e MONGO_URI="your_atlas_url" \
          ${{ secrets.DOCKER_USERNAME }}/voting-system-server:latest

          docker run -d -p 80:80 --name frontend \
          ${{ secrets.DOCKER_USERNAME }}/voting-system-client:latest
